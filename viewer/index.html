<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>clodiff</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

      /* ── Blueprint palette ────────────────────────────────────────────────
         Analogous blue harmony: blue-tinted canvas · cool blue-grey neutrals ·
         cerulean accent (#0077b6) · deep ink text with blue undertone.
         Diff greens/reds kept semantic but cooled to match the overall hue.
      ──────────────────────────────────────────────────────────────────── */

      /* Canvas — not pure white; a whisper of blue makes the whole UI cohere */
      --color-bg: #f4f8fd;
      --color-canvas-subtle: #e8f0f8;
      --color-canvas-inset: #dce8f3;
      --color-border-default: #b8cedd;
      --color-border-muted: #cad9e8;

      /* Text — blue-tinted neutrals, never cold grey */
      --color-fg-default: #0d1f2d;
      --color-fg-muted: #4a6478;
      --color-fg-subtle: #7a9aae;

      /* Diff — cooled to sit in the palette */
      --color-added-bg: #eafaf0;
      --color-added-word-bg: #c0ecd0;
      --color-added-gutter: #3d9e56;
      --color-removed-bg: #fdf0f0;
      --color-removed-word-bg: #f5c8c5;
      --color-removed-gutter: #b84040;

      /* Brand: cerulean — saturated, authoritative, not the generic SaaS blue */
      --color-accent-fg: #0077b6;
      --color-accent-emphasis: #005f93;
      --color-accent-subtle: #dff0f9;

      --color-success-fg: #1a7a38;
      --color-success-emphasis: #2a9648;
      --color-attention-fg: #8a6200;
      --color-danger-fg: #b83030;

      --color-severity-error: #b83030;
      --color-severity-warning: #8a6200;
      --color-severity-suggestion: #0077b6;
      --color-severity-note: #7a9aae;

      --color-outdated-bg: #8a6200;

      /* Hunk header: desaturated cerulean tint — clear blueprint feel */
      --color-hunk-bg: #e4f2fa;
      --color-hunk-fg: #005f93;
      --color-hunk-border: #a8d4ec;

      --radius-sm: 5px;
      --radius-md: 7px;
      --radius-lg: 10px;
      --radius-full: 9999px;

      /* Shadows tinted cool-blue for palette coherence */
      --shadow-sm: 0 1px 2px rgba(10,30,60,0.07), 0 1px 3px rgba(10,30,60,0.05);
      --shadow-md: 0 4px 6px rgba(10,30,60,0.08), 0 2px 4px rgba(10,30,60,0.06);
      --shadow-lg: 0 10px 24px rgba(10,30,60,0.13), 0 4px 8px rgba(10,30,60,0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        /* ── Midnight navy dark — deep ocean, not cold charcoal ──────────── */
        --color-bg: #0d1b28;
        --color-canvas-subtle: #132233;
        --color-canvas-inset: #09131e;
        --color-border-default: #1e3448;
        --color-border-muted: #172c3e;

        /* Text — blue-white tones, not stark */
        --color-fg-default: #c8dde8;
        --color-fg-muted: #6a90a8;
        --color-fg-subtle: #486880;

        /* Diff — dark ocean variants */
        --color-added-bg: #0c2418;
        --color-added-word-bg: #184030;
        --color-added-gutter: #4ab860;
        --color-removed-bg: #271010;
        --color-removed-word-bg: #481c1c;
        --color-removed-gutter: #e05858;

        /* Brand: sky cerulean — higher brightness needed for dark bg */
        --color-accent-fg: #38bdf8;
        --color-accent-emphasis: #0ea5e9;
        --color-accent-subtle: #0c2d42;

        --color-success-fg: #4ab860;
        --color-success-emphasis: #38a050;
        --color-attention-fg: #d4a030;
        --color-danger-fg: #e86060;

        --color-severity-error: #e86060;
        --color-severity-warning: #d4a030;
        --color-severity-suggestion: #38bdf8;
        --color-severity-note: #6a90a8;

        --color-outdated-bg: #8a6500;

        /* Hunk header: deep ocean cerulean */
        --color-hunk-bg: #0c2840;
        --color-hunk-fg: #38bdf8;
        --color-hunk-border: #1a4060;

        --shadow-sm: 0 1px 2px rgba(0,10,30,0.40), 0 1px 3px rgba(0,10,30,0.30);
        --shadow-md: 0 4px 6px rgba(0,10,30,0.35), 0 2px 4px rgba(0,10,30,0.28);
        --shadow-lg: 0 10px 24px rgba(0,10,30,0.55), 0 4px 8px rgba(0,10,30,0.35);
      }
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--color-bg);
      color: var(--color-fg-default);
      font-family: var(--font-ui);
      font-size: 14px;
      line-height: 1.5;
      /* Prevent iOS/Android from auto-scaling small fonts up to "readable" size.
         Without this, --font-code-size: 10px gets inflated to ~16px on mobile
         while UI text at 13px stays put — making code look huge on small setting. */
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    #app {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--color-border-default); border-radius: 3px; }

    /* Global link styling */
    a { color: var(--color-accent-fg); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Code text size — controlled by settings */
    :root { --font-code-size: 12px; }
    [data-text-size="sm"] { --font-code-size: 10px; }
    [data-text-size="md"] { --font-code-size: 12px; }
    [data-text-size="lg"] { --font-code-size: 14px; }
    /* Mobile: floor at 11px so small stays readable and doesn't trigger
       browser upscaling that would make it appear larger than UI text */
    @media (max-width: 768px) {
      [data-text-size="sm"] { --font-code-size: 11px; }
      [data-text-size="md"] { --font-code-size: 12px; }
      [data-text-size="lg"] { --font-code-size: 14px; }
    }

    /* Line wrapping on desktop — toggled in Settings (data-wrap on the <html>).
       Mobile always wraps via the max-width:768px block below regardless. */
    [data-wrap="on"] .diff-line-content {
      white-space: pre-wrap !important;
      word-break: break-word;
      overflow-wrap: anywhere;
    }
    [data-wrap="on"] [data-hunk] { overflow-x: visible; }

    /* Button base — all buttons inherit font, transition */
    button {
      font-family: var(--font-ui);
      cursor: pointer;
      transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease, opacity 0.12s ease, box-shadow 0.12s ease;
    }
    button:disabled { cursor: not-allowed; opacity: 0.5; }
    button:focus-visible {
      outline: 2px solid var(--color-accent-emphasis);
      outline-offset: 2px;
    }

    /* Interactive label (radio buttons in modal) */
    label { transition: border-color 0.12s ease, background 0.12s ease; }

    /* Universal hover: inset shadow overlay works on any bg color */
    button:not(:disabled):hover {
      box-shadow: inset 0 0 0 10000px rgba(0,0,0,0.06);
    }
    @media (prefers-color-scheme: dark) {
      button:not(:disabled):hover {
        box-shadow: inset 0 0 0 10000px rgba(255,255,255,0.07);
      }
    }

    /* Mobile: hide WS status label text, keep only the dot */
    @media (max-width: 520px) {
      .ws-label { display: none; }
    }

    /* Transient line highlight — triggered by the "highlight" WS message */
    /* Target child cells; table-row itself doesn't paint reliably */
    .clodiff-highlight > div {
      background: rgba(253, 215, 0, 0.18) !important;
      transition: background 0.7s ease !important;
    }
    .clodiff-highlight > div:first-child {
      background: rgba(253, 180, 0, 0.9) !important;
    }
    .clodiff-highlight.clodiff-fading > div {
      background: transparent !important;
    }
    .clodiff-highlight.clodiff-fading > div:first-child {
      background: transparent !important;
    }

    /* Monospace code */
    code, pre { font-family: var(--font-mono); }

    /* ── Mobile tweaks ────────────────────────────────────────────── */
    @media (max-width: 768px) {
      /* Code lines wrap instead of scrolling horizontally */
      .diff-line-content {
        white-space: pre-wrap !important;
        word-break: break-all;
        overflow-wrap: anywhere;
      }

      /* Code area no longer needs horizontal scroll */
      [data-hunk] {
        overflow-x: visible;
      }

      /* Comment threads: tighter left indent so card fills the screen */
      .comment-thread {
        padding-left: 12px !important;
        padding-right: 8px !important;
      }

      /* Larger touch targets for line-number gutters */
      .diff-line-content {
        padding-left: 8px !important;
      }

      /* File section header wraps on narrow screens */
      [data-file-path] > div:first-child {
        flex-wrap: wrap;
      }
    }

    @media (max-width: 400px) {
      /* On very small screens collapse header padding */
      header { font-size: 13px; }
    }

    /* ── Markdown body rendering (GitHub-flavored) ───────────────────────── */
    .md-body { overflow-wrap: break-word; word-break: break-word; }
    .md-body > *:first-child { margin-top: 0 !important; }
    .md-body > *:last-child  { margin-bottom: 0 !important; }
    .md-body p   { margin: 0 0 8px; line-height: 1.6; }
    .md-body h1, .md-body h2, .md-body h3,
    .md-body h4, .md-body h5, .md-body h6 {
      margin: 12px 0 4px;
      font-weight: 600;
      color: var(--color-fg-default);
      line-height: 1.3;
    }
    .md-body h1 { font-size: 1.15em; border-bottom: 1px solid var(--color-border-muted); padding-bottom: 4px; }
    .md-body h2 { font-size: 1.05em; border-bottom: 1px solid var(--color-border-muted); padding-bottom: 3px; }
    .md-body h3 { font-size: 0.97em; }
    .md-body ul, .md-body ol { margin: 0 0 8px 20px; padding: 0; }
    .md-body li { margin-bottom: 2px; }
    .md-body li > ul, .md-body li > ol { margin-top: 2px; margin-bottom: 0; }
    .md-body blockquote {
      margin: 0 0 8px;
      padding: 4px 12px;
      border-left: 3px solid var(--color-border-default);
      color: var(--color-fg-muted);
    }
    .md-body code {
      font-family: var(--font-mono);
      font-size: 0.9em;
      background: var(--color-canvas-subtle);
      border: 1px solid var(--color-border-muted);
      border-radius: 3px;
      padding: 1px 4px;
    }
    .md-body pre {
      margin: 0 0 8px;
      padding: 10px 12px;
      background: var(--color-canvas-subtle);
      border: 1px solid var(--color-border-muted);
      border-radius: var(--radius-sm);
      overflow-x: auto;
    }
    .md-body pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: var(--font-code-size);
      white-space: pre;
    }
    .md-body a { color: var(--color-accent-fg); text-decoration: none; }
    .md-body a:hover { text-decoration: underline; }
    .md-body strong { font-weight: 600; }
    .md-body em { font-style: italic; }
    .md-body hr { border: none; border-top: 1px solid var(--color-border-muted); margin: 8px 0; }
    .md-body table { border-collapse: collapse; margin-bottom: 8px; font-size: 0.9em; }
    .md-body th, .md-body td {
      border: 1px solid var(--color-border-default);
      padding: 4px 8px;
      text-align: left;
    }
    .md-body th { background: var(--color-canvas-subtle); font-weight: 600; }
    .md-body input[type="checkbox"] { margin-right: 4px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
